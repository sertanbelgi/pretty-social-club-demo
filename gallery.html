<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri | Pretty Social Club</title>
<link rel="icon" href="/pretty-social-club-demo/img/logo-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pretty-social-club-demo/css/style.css">
</head>
<body>
<header id="site-header"></header>
<section class="page-hero">
  <div class="wrap"><span class="eyebrow">Pretty Social Club</span><h1 data-i18n="gal.title"></h1><p data-i18n="gal.sub"></p></div>
</section>
<section class="section" style="padding-top:60px"><div class="wrap"><div class="masonry" id="masonry"></div></div></section>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Gallery">
  <button class="x" aria-label="Close">×</button><button class="prev" aria-label="Previous">‹</button>
  <img alt=""><button class="next" aria-label="Next">›</button>
</div>
<footer id="site-footer"></footer>
<script type="module">
import { boot, api, esc, pick, t } from '/pretty-social-club-demo/js/app.js';

let items = [], cur = 0, failed = false;
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img');

function show(i) {
  cur = (i + items.length) % items.length;
  lbImg.src = items[cur].image; lbImg.alt = pick(items[cur], 'caption');
  lb.classList.add('open');
}
const close = () => lb.classList.remove('open');
lb.querySelector('.x').onclick = close;
lb.querySelector('.prev').onclick = () => show(cur - 1);
lb.querySelector('.next').onclick = () => show(cur + 1);
lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
});

function render() {
  const m = document.getElementById('masonry');
  if (failed) { m.innerHTML = `<p class="empty">${t('loading.err')}</p>`; return; }
  m.innerHTML = items.map((g, i) =>
    `<button data-i="${i}" aria-label="${esc(pick(g, 'caption'))}"><img src="${esc(g.image)}" alt="${esc(pick(g, 'caption'))}" loading="lazy" decoding="async">${pick(g, 'caption') ? `<span>${esc(pick(g, 'caption'))}</span>` : ''}</button>`).join('');
  m.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => show(Number(b.dataset.i))));
}
boot(render);
api('/api/gallery').then((d) => { items = d; render(); }).catch(() => { failed = true; render(); });
</script>
</body>
</html>
