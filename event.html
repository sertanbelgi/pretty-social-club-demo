<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etkinlik | Pretty Social Club</title>
<link rel="icon" href="/pretty-social-club-demo/img/logo-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pretty-social-club-demo/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="main"><div class="wrap" style="padding-top:140px"><div class="skeleton"></div></div></main>
<footer id="site-footer"></footer>
<script type="module">
import { boot, api, t, esc, pick, money, fmtDate, fmtTime, img } from '/pretty-social-club-demo/js/app.js';

const slug = new URLSearchParams(location.search).get('slug') || '';
const ICON = {
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
};
let ev = null, state = { pkg: null, qty: 1 }, error = false;

function render() {
  const main = document.getElementById('main');
  if (error || !ev) {
    main.innerHTML = `<div class="wrap" style="padding:160px 0;text-align:center"><p>${t(error ? 'ev.notfound' : 'loading.err')}</p><a class="btn ghost" href="/pretty-social-club-demo/events.html">${t('ev.back')}</a></div>`;
    return;
  }
  const title = pick(ev, 'title');
  document.title = `${title} | Pretty Social Club`;
  const buyable = !ev.past && !ev.soldOut;
  const sel = ev.packages.find((p) => p.id === state.pkg && p.left > 0) || ev.packages.find((p) => p.left > 0);
  if (sel) { state.pkg = sel.id; state.qty = Math.min(state.qty, Math.min(10, sel.left)) || 1; }

  const pkgs = ev.packages.map((p) => `
    <label class="pkg${p.left === 0 ? ' off' : ''}">
      <input type="radio" name="pkg" value="${p.id}" ${sel && p.id === sel.id ? 'checked' : ''} ${p.left === 0 || !buyable ? 'disabled' : ''}>
      <span><b>${esc(pick(p, 'name'))}</b><small>${esc(pick(p, 'desc'))}${p.seats > 1 ? ` · ${t('ev.seats2', { n: p.seats })}` : ''}</small></span>
      <span class="p">${money(p.price)}<span class="left">${p.left === 0 ? t('ev.soldout') : p.left <= 6 ? t('ev.left', { n: p.left * p.seats }) : ''}</span></span>
    </label>`).join('');

  const buy = buyable && sel ? `
    <div class="buy-row">
      <div class="qty" role="group" aria-label="${t('ev.qty')}">
        <button type="button" data-q="-1" aria-label="−">−</button><output id="qty">${state.qty}</output><button type="button" data-q="1" aria-label="+">+</button>
      </div>
      <a class="btn" id="buy" href="#">${t('ev.buy')} · <span id="tot">${money(sel.price * state.qty)}</span></a>
    </div>` : `<p class="notice">${ev.past ? t('ev.ended') : t('ev.soldout')}</p>`;

  const program = ev.program.length ? `
    <section class="section tint"><div class="wrap prose">
      <div class="section-head"><span class="eyebrow">${t('ev.program')}</span><h2>${esc(title)}</h2></div>
      <ul class="timeline">${ev.program.map((s) => `<li><time>${esc(s.time)}</time><div><b>${esc(pick(s, 'title'))}</b><span>${esc(pick(s, 'desc'))}</span></div></li>`).join('')}</ul>
    </div></section>` : '';

  main.innerHTML = `
  <div class="wrap event-top">
    <div class="poster">${img(ev.image, title).replace('loading="lazy"', 'fetchpriority="high"')}</div>
    <div class="event-info">
      <a class="eyebrow" href="/pretty-social-club-demo/events.html">← ${t('ev.back')}</a>
      <h1>${esc(title)}</h1>
      <p class="tagline">${esc(pick(ev, 'tagline'))}</p>
      <ul class="facts">
        <li>${ICON.cal}<span><b style="font-weight:400">${esc(fmtDate(ev.date))}</b>${ev.time_start ? `<br>${esc(fmtTime(ev))}` : ''}</span></li>
        ${ev.location_tr ? `<li>${ICON.pin}<span>${esc(pick(ev, 'location'))}</span></li>` : ''}
      </ul>
      <h3 style="margin-top:28px">${t('ev.packages')}</h3>
      <div class="pkgs">${pkgs}</div>
      ${buy}
    </div>
  </div>
  <section class="section"><div class="wrap prose"><div class="section-head" style="margin-bottom:24px"><span class="eyebrow">${t('ev.about')}</span></div>
    ${esc(pick(ev, 'description')).split(/\n+/).map((p) => `<p>${p}</p>`).join('')}</div></section>
  ${program}`;

  const refresh = () => {
    const p = ev.packages.find((x) => x.id === state.pkg);
    if (!p) return;
    const max = Math.min(10, p.left);
    state.qty = Math.min(Math.max(1, state.qty), max);
    document.getElementById('qty').textContent = state.qty;
    document.getElementById('tot').textContent = money(p.price * state.qty);
    document.getElementById('buy').href = `/pretty-social-club-demo/checkout.html?e=${encodeURIComponent(ev.slug)}&p=${p.id}&q=${state.qty}`;
  };
  if (buyable && sel) {
    main.querySelectorAll('input[name=pkg]').forEach((r) => r.addEventListener('change', () => { state.pkg = Number(r.value); refresh(); }));
    main.querySelectorAll('[data-q]').forEach((b) => b.addEventListener('click', () => { state.qty += Number(b.dataset.q); refresh(); }));
    refresh();
  }
}

boot(render);
api(`/api/events/${encodeURIComponent(slug)}`).then((d) => { ev = d; render(); }).catch((e) => { error = e.status === 404; ev = null; render(); });
</script>
</body>
</html>
