<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakkımızda | Pretty Social Club</title>
<link rel="icon" href="/pretty-social-club-demo/img/logo-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pretty-social-club-demo/css/style.css">
</head>
<body>
<header id="site-header"></header>
<section class="page-hero">
  <div class="wrap"><span class="eyebrow">Pretty Social Club</span><h1 data-i18n="about.title"></h1><p data-i18n="about.sub"></p></div>
</section>
<section class="section">
  <div class="wrap">
    <div class="split">
      <img class="reveal" src="/pretty-social-club-demo/img/hero-boat.jpg" alt="" loading="lazy">
      <div class="reveal">
        <h2 data-i18n="about.story.t"></h2>
        <div class="divider" style="margin:20px 0;justify-content:flex-start">♡</div>
        <p data-i18n="about.story.p1"></p>
        <p data-i18n="about.story.p2"></p>
        <a class="btn" href="/pretty-social-club-demo/events.html" data-i18n="nav.tickets"></a>
      </div>
    </div>
    <div class="values">
      <div class="value reveal"><h3 data-i18n="val.1.t"></h3><p data-i18n="val.1.d"></p></div>
      <div class="value reveal"><h3 data-i18n="val.2.t"></h3><p data-i18n="val.2.d"></p></div>
      <div class="value reveal"><h3 data-i18n="val.3.t"></h3><p data-i18n="val.3.d"></p></div>
    </div>
  </div>
</section>
<section class="section tint">
  <div class="wrap"><div class="cta-band reveal">
    <h2 data-i18n="ig.title"></h2><p data-i18n="ig.text"></p>
    <a class="btn light" href="https://www.instagram.com/prettysocial.club/" target="_blank" rel="noopener" data-i18n="ig.cta"></a>
  </div></div>
</section>
<footer id="site-footer"></footer>
<script type="module">
import { boot } from '/pretty-social-club-demo/js/app.js';
boot();
</script>
</body>
</html>
